name: DrawMeOne Disposable Database Integration

# Runs only against an ephemeral MariaDB container; never contacts Hostinger.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'api/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/disposable-integration.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'api/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/disposable-integration.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ephemeral_ci_root_only
          MARIADB_DATABASE: drawmeone_ci
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ephemeral_ci_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DMO_CI_INTEGRATION: '1'
      DB_HOST: 127.0.0.1
      DB_NAME: drawmeone_ci
      DB_USER: ci_user
      DB_PASS: ephemeral_ci_password_only
      DMO_REQUEST_POLICY_VERSION: qa-policy-v1
      DMO_APP_KEY: disposable-ci-key-not-valid-for-production-very-long
      DMO_AUTH_ENABLED: '0'
      DMO_REGISTRATION_ENABLED: '0'
      DMO_REQUESTS_ENABLED: '0'
      DMO_QUOTE_DELIVERY_ENABLED: '0'
      DMO_QUOTE_RESPONSES_ENABLED: '0'
      DMO_ORDER_ADMIN_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Fail early on malformed PHP test scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || { echo "::error file=$file::PHP test syntax invalid"; exit 1; }
          done < <(find tests -maxdepth 1 -type f -name '*.php' -print0)
          echo "INTEGRATION_TEST_PHP_SYNTAX=PASS"
      - name: Install MariaDB client and PHP MySQL extension
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client php-mysql php-curl php-gd >/dev/null
          php -m | grep -Fx pdo_mysql >/dev/null
      - name: Import actual committed schema into throwaway database
        shell: bash
        run: |
          set -Eeuo pipefail
          export MYSQL_PWD="$DB_PASS"
          for n in {1..30}; do
            if mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          gzip -dc database/001_initial_schema.sql.gz | mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME"
          mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database/002_auth_rate_limits.sql
          mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database/003_private_references.sql
          mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database/004_delivery_drafts.sql
          mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database/004_delivery_drafts.sql
          mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database/005_artwork_reviews.sql
          mariadb -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < database/005_artwork_reviews.sql
          echo "DISPOSABLE_SCHEMA=READY"
      - name: Run ownership, privacy and quote/order persistence contract
        run: php tests/integration_contract.php
      - name: Test real HTTP authorization on the disposable database
        run: php tests/http_contract.php
      - name: Remove synthetic records before the next HTTP suite
        run: php tests/ci_reset.php
      - name: Test complete positive quote and unpaid-order workflow over HTTP
        run: php tests/http_positive_contract.php
      - name: Remove synthetic records before account recovery tests
        run: php tests/ci_reset.php
      - name: Exercise email verification, token expiry and password recovery
        run: php tests/http_auth_contract.php
      - name: Reset disposable records before private image QA
        run: php tests/ci_reset.php
      - name: Test private image upload, WebP conversion, isolation and removal
        run: php tests/http_reference_contract.php
      - name: Reset disposable records for artist portfolio QA
        run: php tests/ci_reset.php
      - name: Test artist artwork draft, publish, private preview and unpublish
        run: php tests/http_artwork_contract.php
      - name: Reset disposable records before delivery draft QA
        run: php tests/ci_reset.php
      - name: Test artist-only staged delivery upload and access
        run: php tests/http_delivery_draft_contract.php
      - name: Create isolated recovery database and reset source fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          mariadb -h 127.0.0.1 -u root --password=ephemeral_ci_root_only -e "
            CREATE DATABASE drawmeone_restore_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON drawmeone_restore_ci.* TO 'ci_user'@'%';
          "
          php tests/ci_reset.php
      - name: Independently restore encrypted backup into a different database
        run: php tests/full_backup_restore.php
