name: DrawMeOne Hostinger SSH — Read-only Diagnostics

# No shell commands or arbitrary inputs are accepted from trigger content.
# Agents can request a bounded, READ-ONLY check by updating a fixed trigger
# file on main; no user interaction is needed after initial key setup.
# This workflow never deploys or modifies the Hostinger site/database.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/ops/hostinger-ssh-diagnostic.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: drawmeone-hostinger-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Check PHP, schema and admin bootstrap (no secrets printed)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Inspect Hostinger without making any changes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::HOSTINGER_HOST variable missing/invalid"; exit 1; }
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::HOSTINGER_USER variable missing/invalid"; exit 1; }
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || {
            echo "::error::HOSTINGER_PORT variable missing/invalid"; exit 1;
          }
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || {
            echo "::error::Set HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_KNOWN_HOSTS in the hostinger-diagnostics environment"; exit 1;
          }
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          # Windows-origin secrets can contain CRLF. Strip CR safely on runner.
          sed -i 's/\r$//' "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null || {
            echo "::error::SSH private key is not a valid unencrypted OpenSSH key"; exit 1;
          }
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          site="$HOME/domains/drawmeone.com/public_html"
          [[ -d "$site" && -f "$site/app/cli-admin.php" && -f "$site/app/bootstrap.php" ]] || {
            echo "Expected DrawMeOne PHP deployment is missing"; exit 1;
          }
          for file in artwork.php sitemap.php app/bootstrap.php app/auth.php app/mailer.php app/admin.php app/cli-admin.php app/cli-mail-config.php app/cli-smtp-probe.php app/commission-workflow.php app/quotes.php app/orders.php app/artwork.php app/requests.php app/references.php app/cli-migrate-references.php api/request-status.php api/requests.php api/request.php api/request-message.php api/quote-response.php api/request-attachment.php api/reference.php api/reference-delete.php api/auth/resend-verification.php api/admin/login.php api/admin/email.php api/admin/request.php api/admin/request-actions.php api/admin/quote-send.php api/admin/order-create.php api/portfolio.php api/artwork.php api/admin/artworks.php api/admin/artwork-preview.php api/admin/artwork-upload.php; do
            for attempt in 1 2 3 4 5 6; do
              [[ -f "$site/$file" ]] && break
              sleep 3
            done
            [[ -f "$site/$file" ]] || { echo "Deployment file missing: $file"; exit 1; }
            php -l "$site/$file" >/dev/null || { echo "PHP syntax invalid: $file"; exit 1; }
          done
          for test in mail_smoke.php quote_smoke.php order_smoke.php private_reference_smoke.php mail_dns_check.php; do
            for attempt in 1 2 3 4 5 6; do
              [[ -f "$site/tests/$test" ]] && break
              sleep 3
            done
            [[ -f "$site/tests/$test" ]] || { echo "Deployment test missing: $test"; exit 1; }
            php -l "$site/tests/$test" >/dev/null
          done
          php "$site/tests/mail_smoke.php"
          php "$site/tests/quote_smoke.php"
          php "$site/tests/order_smoke.php"
          php "$site/tests/private_reference_smoke.php"
          php "$site/tests/mail_dns_check.php"
          echo "PHP syntax: PASS"
          if command -v mariadb-dump >/dev/null 2>&1 || command -v mysqldump >/dev/null 2>&1; then
            echo "backup_sql_dump_cli=yes"
          else
            echo "backup_sql_dump_cli=no"
          fi
          if command -v tar >/dev/null 2>&1; then
            echo "backup_tar_cli=yes"
          else
            echo "backup_tar_cli=no"
          fi
          php -r 'echo "backup_sodium=" . (extension_loaded("sodium") ? "yes" : "no") . "\\n";'
          php -r 'echo "backup_openssl=" . (extension_loaded("openssl") ? "yes" : "no") . "\\n";'
          php -r '
          require $argv[1]."/app/artwork.php";
          require_once $argv[1]."/app/requests.php";
          require_once $argv[1]."/app/references.php";
          require_once $argv[1]."/app/quotes.php";
          require_once $argv[1]."/app/orders.php";
          try {
            $db = dmo_database();
            // Table metadata only; never read or print private customer records.
            foreach ([
              "dmo_request_attachments", "dmo_attachments", "dmo_messages",
              "dmo_conversations", "dmo_quotes", "dmo_commission_requests",
              "dmo_orders", "dmo_payments", "dmo_deliverables"
            ] as $tableName) {
              $present = $db->prepare(
                "SELECT COUNT(*) FROM information_schema.TABLES " .
                "WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = :table"
              );
              $present->execute(["table" => $tableName]);
              if (!(int) $present->fetchColumn()) continue;
              foreach ($db->query("SHOW COLUMNS FROM `" . $tableName . "`") as $column) {
                echo "schema_column=" . $tableName . "." . $column["Field"] .
                  ":" . $column["Type"] . "\n";
              }
            }
            echo "private_reference_schema_ready=" .
              (dmo_refs_schema_ready($db) ? "yes" : "no") . "\n";
            echo "order_confirmation_flag=" .
              (dmo_orders_admin_enabled() ? "enabled" : "disabled") . "\n";
            echo "quote_delivery_flag=" .
              (dmo_quote_delivery_enabled() ? "enabled" : "disabled") . "\n";
            echo "quote_response_flag=" .
              (dmo_quote_response_enabled() ? "enabled" : "disabled") . "\n";
            echo "customer_messaging_flag=" .
              (dmo_messages_enabled() ? "open" : "closed") . "\n";
            $stmt = $db->query(
                "SELECT COUNT(*) AS total, " .
                "SUM(CASE WHEN account_status = '\''active'\'' AND email_verified_at IS NOT NULL THEN 1 ELSE 0 END) AS eligible " .
                "FROM dmo_users WHERE role = '\''admin'\''"
            );
            $row = $stmt->fetch(PDO::FETCH_ASSOC);
            $total = (int)($row["total"] ?? 0);
            $active = (int)($row["eligible"] ?? 0);
            echo "db_connected=yes\n";
            echo "admin_record_present=" . ($total > 0 ? "yes" : "no") . "\n";
            echo "eligible_admin_present=" . ($active > 0 ? "yes" : "no") . "\n";
            echo "admin_flag_enabled=" . (dmo_config("DMO_ADMIN_ENABLED") === "1" ? "yes" : "no") . "\n";
            echo "turnstile_key_pair_present=" .
                (dmo_config("DMO_TURNSTILE_SITE_KEY") !== "" &&
                 dmo_config("DMO_TURNSTILE_SECRET") !== "" ? "yes" : "no") . "\n";
            echo "php_curl=" . (extension_loaded("curl") ? "yes" : "no") . "\n";
            echo "gd_available=" . (extension_loaded("gd") ? "yes" : "no") . "\n";
            echo "gd_webp=" . (function_exists("imagewebp") ? "yes" : "no") . "\n";
            echo "imagick_available=" . (extension_loaded("imagick") ? "yes" : "no") . "\n";
            echo "upload_limit=" . ini_get("upload_max_filesize") . "\n";
            echo "post_limit=" . ini_get("post_max_size") . "\n";
            echo "mail_transport=" .
              (in_array(dmo_mail_transport(), ["smtp","php"], true) ?
                 dmo_mail_transport() : "not_configured") . "\n";
            echo "smtp_settings_ready=" . (dmo_mail_smtp_ready() ? "yes" : "no") . "\n";
            echo "transactional_mail_ready=" . (dmo_mail_ready() ? "yes" : "no") . "\n";
            echo "customer_registration_flag=" .
              (dmo_config("DMO_REGISTRATION_ENABLED") === "1" ? "enabled" : "disabled") . "\n";
            echo "customer_auth_available=" . (dmo_auth_configured() ? "yes" : "no") . "\n";
            echo "customer_request_intake=" . (dmo_requests_open() ? "open" : "closed") . "\n";
            echo "request_policy_version_configured=" .
              (dmo_requests_policy_version() !== "" ? "yes" : "no") . "\n";
            echo "artwork_write_flag=" .
              (dmo_artwork_writes_enabled() ? "enabled" : "disabled") . "\n";
            echo "private_storage_parent_writable=" .
              (is_writable(dirname(dmo_artwork_storage_root())) ? "yes" : "no") . "\n";
            $works = $db->prepare(
              "SELECT COUNT(*) FROM dmo_portfolio_artworks WHERE visibility = :visibility"
            );
            $works->execute(["visibility" => "published"]);
            echo "published_artwork_count=" . (int) $works->fetchColumn() . "\n";
          } catch (Throwable $error) {
            echo "Diagnostic failed: ".get_class($error)."\n";
            exit(1);
          }
          ' "$site"
          for check in portfolio sitemap artwork-page request-status commission-page customer-requests customer-message customer-quote customer-attachment customer-reference auth-resend admin-quote admin-order admin-artworks admin-preview admin-mail; do
            case "$check" in
              portfolio) url="https://drawmeone.com/api/portfolio.php" ;;
              sitemap) url="https://drawmeone.com/sitemap.xml" ;;
              artwork-page) url="https://drawmeone.com/artwork.php?id=1" ;;
              request-status) url="https://drawmeone.com/api/request-status.php" ;;
              commission-page) url="https://drawmeone.com/commission.html" ;;
              customer-requests) url="https://drawmeone.com/api/requests.php" ;;
              customer-message) url="https://drawmeone.com/api/request-message.php" ;;
              customer-quote) url="https://drawmeone.com/api/quote-response.php" ;;
              customer-attachment) url="https://drawmeone.com/api/request-attachment.php" ;;
              customer-reference) url="https://drawmeone.com/api/reference.php?id=1" ;;
              auth-resend) url="https://drawmeone.com/api/auth/resend-verification.php" ;;
              admin-quote) url="https://drawmeone.com/api/admin/quote-send.php" ;;
              admin-order) url="https://drawmeone.com/api/admin/order-create.php" ;;
              admin-artworks) url="https://drawmeone.com/api/admin/artworks.php" ;;
              admin-mail) url="https://drawmeone.com/api/admin/email.php" ;;
              admin-preview) url="https://drawmeone.com/api/admin/artwork-preview.php?id=1" ;;
            esac
            status=$(curl -sSL --max-time 12 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "http_${check}=$status"
          done
          if curl -fsSL --max-time 12 https://drawmeone.com/sitemap.xml | grep -q 'xmlns:image='; then
            echo "dynamic_artwork_sitemap=yes"
          else
            echo "dynamic_artwork_sitemap=no"
            exit 1
          fi
          echo "READ_ONLY_DIAGNOSTIC_COMPLETED"
          REMOTE
      - name: Report diagnostic status back to GitHub commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTION_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=failure
          description="SSH diagnostic did not pass; inspect the workflow job"
          if [[ "${CONNECTION_RESULT}" == "success" ]]; then
            state=success
            description="Read-only SSH, PHP and database diagnostic passed"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="drawmeone/hostinger-ssh-readonly" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
