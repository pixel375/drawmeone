name: DrawMeOne Hostinger SSH — Read-only Diagnostics

# No shell commands or arbitrary inputs are accepted from trigger content.
# Agents can request a bounded, READ-ONLY check by updating a fixed trigger
# file on main; no user interaction is needed after initial key setup.
# This workflow never deploys or modifies the Hostinger site/database.
on:
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/ops/hostinger-ssh-diagnostic.trigger
      - .github/workflows/hostinger-ssh-diagnostics.yml
      - ops/deployment_expectations.py

permissions:
  contents: read
  statuses: write

concurrency:
  group: drawmeone-hostinger-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Check PHP, schema and admin bootstrap (no secrets printed)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Hostinger without making any changes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::HOSTINGER_HOST variable missing/invalid"; exit 1; }
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::HOSTINGER_USER variable missing/invalid"; exit 1; }
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || {
            echo "::error::HOSTINGER_PORT variable missing/invalid"; exit 1;
          }
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || {
            echo "::error::Set HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_KNOWN_HOSTS in the hostinger-diagnostics environment"; exit 1;
          }
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          # Windows-origin secrets can contain CRLF. Strip CR safely on runner.
          sed -i 's/\r$//' "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null || {
            echo "::error::SSH private key is not a valid unencrypted OpenSSH key"; exit 1;
          }
          python3 ops/deployment_expectations.py > "$dir/expected"
          { cat "$dir/expected"; cat <<'REMOTE'
          set -Eeuo pipefail
          site="$HOME/domains/drawmeone.com/public_html"
          [[ -d "$site" && -f "$site/app/cli-admin.php" && -f "$site/app/bootstrap.php" ]] || {
            echo "Expected DrawMeOne PHP deployment is missing"; exit 1;
          }
          # Wait for the actual release, not merely a file that appeared during
          # an in-place Hostinger sync. No contents or private paths are printed.
          release_matches() {
            local entry expected file actual
            for entry in "${expected_files[@]}"; do
              expected="${entry%%  *}"
              file="${entry#*  }"
              [[ -f "$site/$file" ]] || return 1
              actual=$(sha256sum "$site/$file" 2>/dev/null | cut -d' ' -f1) || return 1
              [[ "$actual" == "$expected" ]] || return 1
            done
          }
          stable=0
          for attempt in {1..25}; do
            if release_matches; then
              stable=$((stable+1))
              if [[ "$stable" == "2" ]]; then break; fi
            else
              stable=0
            fi
            sleep 4
          done
          [[ "$stable" == "2" ]] || { echo "deployment_release=expected_files_not_stable"; exit 1; }
          echo "deployment_release=expected_files_stable"
          for file in app/studio-v2.php api/studio.php api/admin/studio.php studio-admin/index.php privacy.php app/artwork.php app/admin.php; do
            php -l "$site/$file" >/dev/null
          done
          php -r 'require $argv[1]."/app/admin.php"; $db=dmo_database();if(!dmo_admin_enabled()||!dmo_admin_schema_ready($db)||!(int)$db->query("SELECT COUNT(*) FROM dmo_users WHERE role=".chr(39)."admin".chr(39)." AND account_status=".chr(39)."active".chr(39)." AND email_verified_at IS NOT NULL")->fetchColumn())exit(1);echo "v2_admin_bootstrap=ready\n";' "$site"
          php "$site/app/cli-integrity.php" check
          php -r 'require $argv[1]."/app/backup-health.php"; $r=dmo_backup_local_health(); if(!$r["ready"])exit(1); echo "local_backup=ready\n";' "$site"
          home=$(curl -fsS --max-time 15 https://drawmeone.com/)
          [[ "$home" == *'styles.css?v=202'* && "$home" == *'id="gallery"'* && "$home" != *'Design Lab'* ]] || exit 1
          desk=$(curl -fsS --max-time 15 https://drawmeone.com/studio-admin/index.php)
          [[ "$desk" == *'panel.js?v=202'* && "$desk" == *'My studio'* && "$desk" != *'Orders & quotes'* ]] || exit 1
          curl -fsS --max-time 15 https://drawmeone.com/api/studio.php | php -r '$d=json_decode(stream_get_contents(STDIN),true);if(($d["ok"]??false)!==true||($d["settings"]["accepting"]??null)!==false)exit(1);echo "v2_commissions=closed\n";'
          curl -fsS --max-time 15 https://drawmeone.com/api/portfolio.php | php -r '$d=json_decode(stream_get_contents(STDIN),true);if(($d["ok"]??false)!==true||!is_array($d["works"]??null))exit(1);echo "v2_published_art_count=".count($d["works"])."\n";'
          curl -fsS --max-time 15 https://drawmeone.com/api/admin/status.php | php -r '$d=json_decode(stream_get_contents(STDIN),true);if(($d["admin_available"]??false)!==true)exit(1);echo "v2_admin=available\n";'
          for path in api/auth/signup.php api/requests.php api/checkout.php api/admin/finance.php api/admin/quote-send.php assets/demo/art-01.svg data/demo-portfolio.json app/cli-admin.php; do
            code=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "https://drawmeone.com/$path")
            [[ "$code" == "403" || "$code" == "404" ]] || { echo "legacy_route_not_closed=$path:$code"; exit 1; }
          done
          # Wait for the separate fixed additive schema migration, never mutate here.
          for attempt in {1..20}; do
            if php -r 'require $argv[1]."/app/studio-v2.php";exit(dmo_guest_ready(dmo_database())?0:1);' "$site"; then break; fi
            [[ "$attempt" != 20 ]] || { echo "v2_guest_schema=unavailable"; exit 1; }
            sleep 3
          done
          echo "v2_guest_schema=ready"
          code=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' -H 'Origin: https://drawmeone.com' -H 'Content-Type: application/json' --data '{"name":"closed gate probe"}' https://drawmeone.com/api/guest-request.php)
          [[ "$code" == "503" ]] || { echo "v2_guest_closed_probe=unexpected_$code"; exit 1; }
          echo "v2_guest_closed_probe=passed"
          for path in api/admin/studio.php api/admin/artworks.php api/admin/guest-requests.php; do
            code=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "https://drawmeone.com/$path")
            [[ "$code" == "401" || "$code" == "503" ]] || exit 1
          done
          release_matches || { echo "deployment_release=changed_during_diagnostic"; exit 1; }
          echo "V2_LIVE_RELEASE=PASS"
          echo "deployment_release=unchanged_at_completion"
          REMOTE
          } | ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se'
      - name: Report diagnostic status back to GitHub commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTION_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=failure
          description="SSH diagnostic did not pass; inspect the workflow job"
          if [[ "${CONNECTION_RESULT}" == "success" ]]; then
            state=success
            description="Read-only SSH, PHP and database diagnostic passed"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="drawmeone/hostinger-ssh-readonly" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
