name: DrawMeOne — Disable Private Artist Uploads

# Only an explicit, allowlisted main-branch trigger can run this fixed
# server action. No untrusted commands, PR triggers or workflow inputs.
on:
  push:
    branches: [main]
    paths: ['.github/ops/artwork-disable.trigger']

permissions:
  contents: read
  statuses: write

concurrency:
  group: drawmeone-hostinger-artwork-activation
  cancel-in-progress: false

jobs:
  inspect:
    name: Disable artist upload without touching customer data
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Preflight and update one private configuration flag
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::HOSTINGER_HOST variable missing/invalid"; exit 1; }
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::HOSTINGER_USER variable missing/invalid"; exit 1; }
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || {
            echo "::error::HOSTINGER_PORT variable missing/invalid"; exit 1;
          }
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || {
            echo "::error::Set HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_KNOWN_HOSTS in the hostinger-diagnostics environment"; exit 1;
          }
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          # Windows-origin secrets can contain CRLF. Strip CR safely on runner.
          sed -i 's/\r$//' "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null || {
            echo "::error::SSH private key is not a valid unencrypted OpenSSH key"; exit 1;
          }
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          site="$HOME/domains/drawmeone.com/public_html"
          [[ -f "$site/app/artwork.php" && -f "$site/api/admin/artwork-upload.php" ]] || {
            echo "Artwork application files not deployed"; exit 1;
          }
          for file in app/artwork.php api/admin/artwork-upload.php api/admin/artworks.php api/portfolio.php api/artwork.php; do
            php -l "$site/$file" >/dev/null || exit 1
          done
          php -r '
          require $argv[1]."/app/artwork.php";
          if (!extension_loaded("gd") || !function_exists("imagewebp")) {
            fwrite(STDERR, "WebP processing unavailable\n"); exit(1);
          }
          if (dmo_config("DMO_ADMIN_ENABLED") !== "1") {
            fwrite(STDERR, "Admin login disabled\n"); exit(1);
          }
          $db = dmo_database();
          foreach (["dmo_portfolio_artworks","dmo_artwork_files","dmo_audit_log"] as $table) {
            $db->query("SELECT id FROM " . $table . " LIMIT 0");
          }
          $env = dmo_private_env_path();
          if ($env === null || !is_file($env) || !is_writable($env) || is_link($env)) {
            fwrite(STDERR, "Private config not writable\n"); exit(1);
          }
          $old = file_get_contents($env);
          if (!is_string($old) || strlen($old) > 131072) exit(1);
          $new = preg_replace(
            "/^[ \t]*DMO_ARTWORK_WRITES_ENABLED[ \t]*=.*(?:\r?\n|$)/m", "", $old
          );
          if (!is_string($new)) exit(1);
          $new = rtrim($new, "\r\n") . "\nDMO_ARTWORK_WRITES_ENABLED=0\n";
          $tmp = tempnam(dirname($env), ".dmo-artwork-");
          if ($tmp === false) exit(1);
          try {
            if (file_put_contents($tmp, $new, LOCK_EX) !== strlen($new)) {
              throw new RuntimeException("Private config write failed");
            }
            chmod($tmp, fileperms($env) & 0777);
            if (!rename($tmp, $env)) {
              throw new RuntimeException("Private config rename failed");
            }
          } finally {
            if (is_file($tmp)) unlink($tmp);
          }
          echo "artwork_upload_flag_enabled=no\n";
          ' "$site"
          REMOTE
      - name: Report artwork-disable status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTION_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=failure
          description="Artwork upload disable failed; inspect workflow job"
          if [[ "${CONNECTION_RESULT}" == "success" ]]; then
            state=success
            description="Artist artwork upload disabled; public gallery stays unchanged"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="drawmeone/artist-upload-disable" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
