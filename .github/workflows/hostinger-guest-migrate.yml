name: DrawMeOne — Add V2 Guest Request Schema

# Fixed additive database migration only. No SQL or shell input from trigger.
on:
  push:
    branches: [main]
    paths: ['.github/ops/guest-request-migrate.trigger']

permissions:
  contents: read
  statuses: write

concurrency:
  group: drawmeone-hostinger-guest-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed additive schema only if commission intake remains closed
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || exit 1
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sed 's/\r$//' > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          {
            printf 'expected_migration=%s\n' "$(sha256sum app/cli-migrate-guest.php | cut -d' ' -f1)"
            printf 'expected_schema=%s\n' "$(sha256sum database/007_guest_requests.sql | cut -d' ' -f1)"
            cat <<'REMOTE'
          set -Eeuo pipefail
          site="$HOME/domains/drawmeone.com/public_html"
          for attempt in {1..30}; do
            if [[ -f "$site/app/cli-migrate-guest.php" && -f "$site/database/007_guest_requests.sql" ]] &&
               [[ "$(sha256sum "$site/app/cli-migrate-guest.php" | cut -d' ' -f1)" == "$expected_migration" ]] &&
               [[ "$(sha256sum "$site/database/007_guest_requests.sql" | cut -d' ' -f1)" == "$expected_schema" ]]; then break; fi
            [[ "$attempt" != 30 ]] || exit 1
            sleep 3
          done
          php "$site/app/cli-migrate-guest.php" apply
          REMOTE
          } | ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se'
      - name: Publish sanitized migration result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=failure
          description="Guest request schema was not verified"
          if [[ "$JOB_RESULT" == "success" ]]; then
            state=success
            description="Guest request schema ready; customer service remains closed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="drawmeone/guest-request-schema" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
