name: DrawMeOne — Encrypted Private Backup

# Only fixed backup commands via pinned SSH; no arbitrary script inputs.
# First controlled encrypted backup succeeded on 2026-11-24.
# Daily local snapshot rotation; independent offsite backup remains separate.
on:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths: ['.github/ops/private-backup.trigger']

permissions:
  contents: read
  statuses: write

concurrency:
  group: drawmeone-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Encrypt and validate private Hostinger backup
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || exit 1
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sed 's/\r$//' > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'php -l "$HOME/domains/drawmeone.com/public_html/app/cli-backup.php" >/dev/null &&
             php "$HOME/domains/drawmeone.com/public_html/app/cli-backup.php" run &&
             php "$HOME/domains/drawmeone.com/public_html/app/cli-backup.php" verify-latest &&
             php "$HOME/domains/drawmeone.com/public_html/app/cli-backup.php" restore-check'
      - name: Report sanitized backup outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          description="Encrypted private backup was not verified"
          if [[ "$JOB_RESULT" == "success" ]]; then
            state=success
            description="Local private encrypted backup verified; offsite copy not configured"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="drawmeone/encrypted-local-backup" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
