name: DrawMeOne — Independent Encrypted Offsite Copy (configured only)

# Deliberately manual-only until an independent destination and separate
# recovery-key custody are approved. NEVER put database secrets or the
# backup decryption key in GitHub Actions or in the remote rclone folder.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawmeone-offsite-copy
  cancel-in-progress: false

jobs:
  copy-ciphertext:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      OFFSITE_RCLONE_CONFIG: ${{ secrets.DMO_OFFSITE_RCLONE_CONFIG }}
      OFFSITE_RCLONE_DEST: ${{ vars.DMO_OFFSITE_RCLONE_DEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configured independent destination
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${OFFSITE_RCLONE_CONFIG:-}" && -n "${OFFSITE_RCLONE_DEST:-}" ]] || {
            echo "::error::Offsite destination is not configured; no copy attempted."
            exit 1
          }
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || exit 1
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || exit 1
          bash -n ops/offsite-upload.sh
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rclone >/dev/null
      - name: Fetch authenticated ciphertext and verify independent remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          temp=$(mktemp -d)
          trap 'rm -rf -- "$temp"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > "$temp/ssh-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sed 's/\r$//' > "$temp/known-hosts"
          printf '%s\n' "$OFFSITE_RCLONE_CONFIG" > "$temp/rclone.conf"
          chmod 600 "$temp/ssh-key" "$temp/known-hosts" "$temp/rclone.conf"
          ssh-keygen -y -P '' -f "$temp/ssh-key" >/dev/null
          export LOCAL_ENCRYPTED_SNAPSHOT="$temp/encrypted-only.bak"
          export OFFSITE_RCLONE_CONFIG_PATH="$temp/rclone.conf"
          export OFFSITE_OBJECT_NAME="dmo-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.bak"
          # The Hostinger CLI authenticates the encrypted bytes before streaming.
          # stdout is redirected to a 0600 temporary file, never GitHub logs.
          ssh -T -o BatchMode=yes -o LogLevel=ERROR -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$temp/known-hosts" \
            -o IdentitiesOnly=yes -i "$temp/ssh-key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'php "$HOME/domains/drawmeone.com/public_html/app/cli-backup.php" export-latest' \
            > "$LOCAL_ENCRYPTED_SNAPSHOT"
          chmod 600 "$LOCAL_ENCRYPTED_SNAPSHOT"
          bash ops/offsite-upload.sh
          echo "offsite_status=verified_ciphertext_copy_only"
          echo "recovery_key_custody=still_requires_separate_confirmation"
