name: DrawMeOne - One SMTP Delivery Probe

# Fixed, rate-limited one-message test to the VERIFIED ADMIN address only.
# No arbitrary command, recipient, or user-supplied content.
on:
  push:
    branches: [main]
    paths: ['.github/ops/smtp-probe.trigger']

permissions:
  contents: read
  statuses: write

concurrency:
  group: drawmeone-hostinger-mail-test
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hostinger-diagnostics
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Send exactly one SMTP diagnostic to the recorded administrator
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SSH_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "${SSH_USER:-}" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          [[ "${SSH_PORT:-}" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || exit 1
          [[ -n "${SSH_PRIVATE_KEY:-}" && -n "${SSH_KNOWN_HOSTS:-}" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sed 's/\r$//' > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" \
            -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'php "$HOME/domains/drawmeone.com/public_html/app/cli-smtp-probe.php" send-admin-test'
      - name: Report sanitized result on trigger commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          state=failure
          description="Fixed SMTP probe failed; check numeric SMTP/cURL diagnostics"
          if [[ "$JOB_RESULT" == "success" ]]; then
            state=success
            description="SMTP accepted test to admin; inbox delivery unconfirmed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="drawmeone/smtp-probe" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
